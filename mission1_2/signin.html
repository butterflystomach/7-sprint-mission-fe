<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda Market Sign-in</title>
    <link rel="stylesheet" href="login.css" />
    <link rel="stylesheet" href="reset.css" />
</head>
<body>
    <header class="container2">
        <div class="logo">
            <a class="logoLink" href="index.html"><img src="/mission1_2/img/logo for login.svg" />
            <h1 class="name">판다마켓</h1></a>
        </div>
        <div class="main">
            <form id="loginForm">
                <div class="email">
                    <h2 class="emailTxt">이메일</h2>
                    <input class="typeMail" type="email" name="userName" placeholder="이메일을 입력해주세요" />
                    <p id="email-error"></p>    
                </div>
                <div class="nickname">
                    <h2 class="nicknameTxt">닉네임</h2>
                    <div>
                        <input class="typeName" type="text" name="userNickname" placeholder="닉네임을 입력해주세요" />
                    </div>  
                    <p id="nickname-error"></p>  
                </div>
                <div class="password">
                    <h2 class="passwordTxt">비밀번호</h2>
                    <div class="passwordAndImg">
                        <input class="typePassword" type="password" name="userPassword" placeholder="비밀번호를 입력해주세요" />
                        <img src="/mission1_2/img/btn_visibility_on_24px.svg" alt="비밀번호 보기" class="toggle-passoword">
                    </div>
                        <p id="password-error"></p>    
                </div>
                <div class="checkPassword">
                    <h2 class="checkPasswordTxt">비밀번호 확인</h2>
                    <div class="passwordAndImg">
                        <input class="confirmPassword" type="password" name="userPassword" placeholder="비밀번호를 다시 한 번 입력해주세요" />
                        <img src="/mission1_2/img/btn_visibility_on_24px.svg" alt="비밀번호 보기" class="toggle-passoword">
                    </div>
                        <p id="checkPassword-error"></p>    
                </div>
                <div class="signinBtn">
                    <button class="click" type="submit" disabled>
                        <span class="signinTxt">회원가입</span>
                    </button>
                </div>
            </form>
            <div class="easyLogin">
                <div class="easyLogin2">
                    <h2 class="easyTxt">간편 로그인하기</h2>
                    <div class="easyImg">
                        <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer"><img src="/mission1_2/img/Component 2.svg" /></a>
                        <a href="https://www.kakaocorp.com/page/" target="_blank" rel="noopener noreferrer"><img src="/mission1_2/img/Component 3.svg" /></a>
                    </div>
                </div>
            </div>
            <div class="login">
                <p class="loginTxt1">이미 회원이신가요?</p>
                <p><a class="loginLink" href="./login.html">로그인</a></p>
            </div>
        </div>
    </header>
<script src="login.js"></script>
</body>
</html>
