<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda Market Log-in</title>
    <link rel="stylesheet" href="login.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css">
    <link rel="stylesheet" href="reset.css" />
    <script src="login.js" /> 
</head>
<body>
    <header class="container1">
        <div class="logo">
            <a class="logolink" href="index.html"><img src="/mission1_2/img/logo for login.svg" />
            <h1 class="name">판다마켓</h1></a>
        </div>
        <div class="main">
            <div class="email">
                <h2 class="emailtxt">이메일</h2>
                <input class="typemail" type="email" name="username" placeholder="이메일을 입력해주세요" />    
            </div>
            <div class="password">
                <h2 class="passwordtxt">비밀번호</h2>
                <div class="passwordandimg">
                    <input class="typepassword" type="password" name="userPassword" placeholder="비밀번호를 입력해주세요" />
                    <img src="/mission1_2/img/btn_visibility_on_24px.svg" alt="비밀번호 보기" class="toggle-passoword" />
                </div>    
            </div>
            <div class="loginbutton">
                <button class="click" type="submit">
                    <span class="logintxt">로그인</span>
                </button>
            </div>
            <div class="easylogin">
                <div class="easylogin2">
                    <h2 class="easytxt">간편 로그인하기</h2>
                    <div class="easyimg">
                        <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer"><img src="/mission1_2/img/Component 2.svg" /></a>
                        <a href="https://www.kakaocorp.com/page/" target="_blank" rel="noopener noreferrer"><img src="/mission1_2/img/Component 3.svg" /></a>
                    </div>
                </div>
            </div>
            <div class="signin">
                <p class="signtxt1">판다마켓이 처음이신가요?</p>
                <p><a class="signlink" href="./signin.html">회원가입</a></p>
        </div>
    </header>
</body>
</html>
