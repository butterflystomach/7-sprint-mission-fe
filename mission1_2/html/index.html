<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="reset.css" />
</head>
<body>
    <div class="wrap">
        <header>
            <div class="top">
                <div class="logo">
                    <a class="logoImg" href="index.html"><img src="/mission1_2/img/판다 얼굴.svg" alt="판다마켓" /></a>
                    <h1 class="logoTxt">판다마켓</h1>
                </div>
                <div class="login">
                    <a class="loginBtn btnStyle btnTxt" href="./login.html">로그인</a>
                </div>
            </div>
        </header>
        <main>
            <section class="banner">
                <div class="inner">
                    <div class="bannerTxt txtStyle">
                        <h2>일상의 모든 물건을 <br />거래해 보세요</h2>
                        <a href="./html/govisit/" target="_blank" class="goVisit visitTxt">구경하러 가기</a>
                    </div>
                    <div class="topImg">
                        <img src="/mission1_2/img/Img_home_top.png" />
                    </div>
                </div>
            </section>
            <section class="contents">
                <article>
                    <div class="img1">
                        <img src="/mission1_2/img/Img_home_01.png" />
                    </div>
                    <div class="txtArea">
                        <span>Hot Item</span>
                        <h3>인기 상품을 <br />확인해 보세요</h3>
                        <p>가장 HOT한 중고거래 물품을<br />판다마켓에서 확인해 보세요</p>
                    </div>
                </article>
                <article>
                    <div class="txtArea">
                        <span>Search</span>
                        <h3>구매를 원하는 <br />상품을 검색하세요</h3>
                        <p>구매하고 싶은 물품은 검색해서 <br />쉽게 찾아보세요</p>
                    </div>
                    <div class="img2">
                        <img src="/mission1_2/img/Img_home_02.png" />
                    </div>
                </article>
                <article>
                    <div class="img3">
                        <img src="/mission1_2/img/Img_home_03.png" />
                    </div>
                    <div class="txtArea">
                        <span>Register</span>
                        <h3>판매를 원하는 <br />상품을 등록하세요</h3>
                        <p>어떤 물건이든 판매하고 싶은 상품을 <br />쉽게 등록하세요</p>
                    </div>
                </article>
            </section>
            <section class="banner">
                <div class="inner2">
                    <div class="bannerTxt">
                        <h2>믿을 수 있는 <br />판다마켓 중고 거래</h2>
                    </div>
                    <div class="bannerImg">
                        <img src="/mission1_2/img/Img_home_bottom.png" />
                    </div>
                </div>
            </section>
        </main>
        <footer class="underBar">
            <div class="foot">
                <p class="copyRight">@codeit - 2024</p>
                <p class="privacyFaq">
                    <a href="./html/privacy/" target="_blank">Privacy Policy</a>
                    <a href="./html/faq/" target="_blank">FAQ</a>
                </p>
                <p class="sns">
                    
                        <a href="https://www.facebook.com/" target="_blank">

                        </a>
                    
                    
                        <a href="https://x.com/" target="_blank">
                            <img src="/mission1_2/img/ic_twitter.svg" />
                        </a>
                    
                    
                        <a href="https://www.youtube.com/" target="_blank">
                            <img src="/mission1_2/img/ic_youtube.svg" />
                        </a>
                    
                    
                        <a href="https://www.instagram.com/" target="_blank">
                            <img src="/mission1_2/img/ic_instagram.svg" />
