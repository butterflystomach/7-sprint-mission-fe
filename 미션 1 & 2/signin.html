<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda Market Log-in</title>
    <link rel="stylesheet" href="login.css" />
    <link rel="stylesheet" href="reset.css" />
</head>
<body>
    <header class="container2">
        <div class="logo">
            <a class="logolink" href="index.html"><img src="./logo for login.svg" />
            <h1 class="name">판다마켓</h1></a>
        </div>
        <div class="main">
            <div class="email">
                <h2 class="emailtxt">이메일</h2>
                <input class="typemail" type="email" name="username" placeholder="이메일을 입력해주세요" />    
            </div>
            <div class="nickname">
                <h2 class="nicknametxt">닉네임</h2>
                <div>
                    <input class="typename" type="text" name="userNickname" placeholder="닉네임을 입력해주세요" />
                </div>    
            </div>
            <div class="password">
                <h2 class="passwordtxt">비밀번호</h2>
                <div class="passwordandimg">
                    <input class="typepassword" type="password" name="userPassword" 
                    placeholder="비밀번호를 입력해주세요" />
                    <img src="./btn_visibility_on_24px.svg" alt="비밀번호 보기" class="toggle-passoword">
                </div>    
            </div>
            <div class="checkpassword">
                <h2 class="checkpasswordtxt">비밀번호 확인</h2>
                <div class="passwordandimg">
                    <input class="typepassword" type="password" name="userPassword" 
                    placeholder="비밀번호를 다시 한 번 입력해주세요" />
                    <img src="./btn_visibility_on_24px.svg" alt="비밀번호 보기" class="toggle-passoword">
                </div>    
            </div>
            <div class="signinbutton">
                <button class="click" type="submit">
                    <span class="signintxt">회원가입</span>
                </button>
            </div>
            <div class="easylogin">
                <div class="easylogin2">
                    <h2 class="easytxt">간편 로그인하기</h2>
                    <div class="easyimg">
                        <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer"><img src="./Component 2.svg" /></a>
                        <a href="https://www.kakaocorp.com/page/" target="_blank" rel="noopener noreferrer"><img src="./Component 3.svg" /></a>
                    </div>
                </div>
            </div>
            <div class="login">
                <p class="logintxt1">이미 회원이신가요?</p>
                <p><a class="loginlink" href="./login.html">로그인</a></p>
            </div>
        </div>
    </header>
</body>
</html>
