<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda Market Log-in</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css">
    <link rel="stylesheet" href="../css/reset.css" />
</head>
<body>
    <header class="container1">
        <div class="logo">
            <a class="logoLink" href="index.html"><img src="../img/logo for login.svg" />
            <h1 class="name">판다마켓</h1></a>
        </div>
        <div class="main">
            <form id="loginForm">
                <div class="email">
                    <h2 class="emailTxt">이메일</h2>
                    <input class="typeMail" type="email" name="userName" placeholder="이메일을 입력해주세요" />
                    <p id="email-error"></p>  
                </div>
                <div class="password">
                    <h2 class="passwordTxt">비밀번호</h2>
                    <div class="passwordAndImg">
                        <input class="typePassword" type="password" name="userPassword" placeholder="비밀번호를 입력해주세요" />
                        <img src="../img/btn_visibility_on_24px.svg" alt="비밀번호 보기" class="toggle-passoword" />
                    </div>  
                        <p id="password-error"></p>  
                </div>
                <div class="loginButton">
                    <button class="click" type="submit" disabled>
                        <span class="loginTxt">로그인</span>
                    </button>
                </div>
            </form>
            <div class="easyLogin">
                <div class="easyLogin2">
                    <h2 class="easyTxt">간편 로그인하기</h2>
                    <div class="easyImg">
                        <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer"><img src="../img/Component 2.svg" /></a>
                        <a href="https://www.kakaocorp.com/page/" target="_blank" rel="noopener noreferrer"><img src="../img/Component 3.svg" /></a>
                    </div>
                </div>
            </div>
            <div class="signIn">
                <p class="signTxt1">판다마켓이 처음이신가요?</p>
                <p><a class="signLink" href="signin.html">회원가입</a></p>
            </div>
        </div>    
    </header>
<!-- <script src="../js/input.js"></script> -->
<script type="module" src="../js/login.js"></script>
</body>
</html>
